
# the solar system is the barycenter, it will be an actual entity that exists at that point in space
# you can load a bunch of solar systems into the same scene, all at once
# everything orbits the barycenter by default
solar_system:
  barycenter: [0, 0, 0]
  bodies:
    - sol: # this is an implicit name
        material: "example/materials/planets/sun.yaml"
        radius: 696000000
        mass: 1.988416e30
        semiMajorAxis: 0.1
        eccentricity: 0
        inclination: 0
        longitudePeriapsis: 0
        longitudeAscendingNode: 0
        orbits: barycenter
    - mercury:
        material: "example/materials/planets/mercury.yaml"
        radius: 2440530
        mass: 0.330103e24
        semiMajorAxis: 5.79091e10
        eccentricity: 0.2000000564
        inclination: 7.00559432
        longitudePeriapsis: 77.45771895
        longitudeAscendingNode: 48.33961819
        orbits: barycenter
